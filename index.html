<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A beautiful Happy Raksha Bandhan wish for sisters.">
  <title>Happy Raksha Bandhan 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.22) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.18) 0 2px, transparent 3px),
        linear-gradient(135deg, #6a11cb, #ff3d81 55%, #ff8a00);
      background-size: 70px 70px, 90px 90px, auto;
      color: white;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(92vw, 720px);
      padding: 48px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 30px;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
      animation: appear 1.2s ease-out;
      position: relative;
      z-index: 2;
    }

    .rakhi {
      font-size: 4.5rem;
      animation: float 2.8s ease-in-out infinite;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1;
      margin-bottom: 18px;
      text-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    .subtitle {
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      line-height: 1.6;
      max-width: 580px;
      margin: 0 auto 26px;
    }

    .heart {
      font-size: 2rem;
      letter-spacing: 10px;
    }

    .signature {
      margin-top: 22px;
      font-size: 1rem;
      opacity: .9;
    }

    .particle {
      position: fixed;
      top: -30px;
      z-index: 1;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(35px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Raksha Bandhan greeting">
    <div class="rakhi">🎀</div>
    <h1>Happy Raksha Bandhan 💖</h1>
    <p class="subtitle">
      To all the wonderful sisters — may your life always be filled
      with happiness, love, laughter and beautiful memories.
    </p>
    <div class="heart">💝 ✨ 💝</div>
    <p class="signature">With lots of love &amp; best wishes 🌸</p>
  </main>

  <script>
    const symbols = ["💖", "✨", "🌸", "💝", "🎀"];

    function createParticle() {
      const el = document.createElement("span");
      el.className = "particle";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (16 + Math.random() * 22) + "px";
      el.style.animationDuration = (5 + Math.random() * 5) + "s";
      el.style.opacity = 0.5 + Math.random() * 0.5;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 11000);
    }

    setInterval(createParticle, 450);
    for (let i = 0; i < 12; i++) setTimeout(createParticle, i * 120);
  </script>
</body>
</html>
